services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    mem_limit: 100m
    cpus: 0.50
    networks:
      - pipeline

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${SOURCE_TOPIC_PARTITIONS:-${TOPIC_PARTITIONS:-6}}
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
    mem_limit: 600m
    cpus: 1.50
    networks:
      - pipeline

  pipeline:
    image: ${PIPELINE_IMAGE:-docrushi/kafka-pipeline:latest}
    pull_policy: always
    depends_on:
      - kafka
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      KAFKA_BROKER: kafka:29092
      OUTPUT_DIR: /app/output
      TOTAL_RECORDS: ${TOTAL_RECORDS:-50000000}
      SOURCE_TOPIC_PARTITIONS: ${SOURCE_TOPIC_PARTITIONS:-${TOPIC_PARTITIONS:-6}}
      OUTPUT_TOPIC_PARTITIONS: ${OUTPUT_TOPIC_PARTITIONS:-1}
      PRODUCER_NUM_WORKERS: ${PRODUCER_NUM_WORKERS:-4}
      PRODUCER_BATCH_SIZE: ${PRODUCER_BATCH_SIZE:-10000}
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE:-10000}
      KAFKA_BATCH_TIMEOUT: ${KAFKA_BATCH_TIMEOUT:-100}
      CONSUMER_NUM_WORKERS: ${CONSUMER_NUM_WORKERS:-1}
      CONSUMER_BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-1000000}
      CONSUMER_COMMIT_BATCH_SIZE: ${CONSUMER_COMMIT_BATCH_SIZE:-20000}
      CONSUMER_MIN_BYTES: ${CONSUMER_MIN_BYTES:-1000000}
      CONSUMER_MAX_BYTES: ${CONSUMER_MAX_BYTES:-100000000}
      CONSUMER_IDLE_TIMEOUT_SECS: ${CONSUMER_IDLE_TIMEOUT_SECS:-10}
      CONSUMER_IDLE_MAX_ATTEMPTS: ${CONSUMER_IDLE_MAX_ATTEMPTS:-6}
      MERGER_BATCH_SIZE: ${MERGER_BATCH_SIZE:-50000}
      SOURCE_TOPIC: source
      ID_TOPIC: id
      NAME_TOPIC: name
      CONTINENT_TOPIC: continent
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    mem_limit: 1248m
    cpus: 2.00
    restart: "no"
    networks:
      - pipeline

networks:
  pipeline:
    driver: bridge
